name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python, DuckDB & Notebook Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and syntax-check all Python modules
        run: |
          python -m py_compile \
            aggregate.py \
            backtest.py \
            features.py \
            forecast_window.py \
            ingest.py \
            model.py \
            verify_backtest.py \
            test_aggregate.py \
            test_backtest.py \
            test_features.py \
            test_forecast_window.py \
            test_ingest.py \
            test_model.py

      - name: Run unit and DuckDB integration test suite
        run: |
          python -B -m unittest -v

      - name: Verify Colab experiment notebook structure and provenance reports
        run: |
          python -B -c "
          import json
          from pathlib import Path
          nb = json.loads(Path('notebooks/ridership_forecast_experiment.ipynb').read_text())
          assert nb.get('nbformat') == 4, 'expected nbformat 4'
          cells = nb.get('cells', [])
          assert len(cells) >= 8, 'expected complete notebook cells'
          code_cells = [c for c in cells if c.get('cell_type') == 'code']
          assert all(c.get('outputs') for c in code_cells), 'all code cells must have verified outputs'
          for report_name in ('baseline_development.json', 'features_development.json', 'model_development.json'):
              data = json.loads((Path('reports') / report_name).read_text())
              assert data.get('format_version') == 1, report_name
          print('Verified Colab notebook and report artifacts.')
          "
